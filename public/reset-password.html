<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neues Passwort festlegen | TableAI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --page-bg: #F3EFEA;
            --card-bg: #FFFFFF;
            --text-main: #292522;
            --text-muted: #746A63;
            --accent: #D4A373;
            --accent-hover: #C9925F;
            --border: #DDD3CA;
            --danger: #A63E3E;
            --success: #357A42;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Plus Jakarta Sans",
                system-ui,
                sans-serif;

            background: var(--page-bg);
            color: var(--text-main);
        }

        .page {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 38px;

            box-shadow:
                0 22px 50px rgba(75, 55, 42, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-flex;
            padding: 7px 15px;

            border-radius: 999px;

            background: #F8EFE7;
            border: 1px solid #E7CDB4;

            color: var(--accent);

            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 18px 0 10px;

            font-size: 1.8rem;
            letter-spacing: -0.04em;
        }

        .header p {
            margin: 0;

            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 700;
        }

        .password-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;

            padding: 13px 92px 13px 14px;

            border: 1.5px solid var(--border);
            border-radius: 9px;

            font: inherit;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(212, 163, 115, 0.20);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: var(--accent);

            font: inherit;
            font-size: 0.78rem;
            font-weight: 700;

            cursor: pointer;
        }

        .field-help {
            color: var(--text-muted);
            font-size: 0.72rem;
            line-height: 1.5;
        }

        .btn-submit {
            width: 100%;

            padding: 14px 20px;

            border: none;
            border-radius: 9px;

            background: var(--accent);
            color: var(--text-main);

            font: inherit;
            font-weight: 800;

            cursor: pointer;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            display: none;

            padding: 12px 14px;
            margin-bottom: 18px;

            border-radius: 8px;

            font-size: 0.84rem;
        }

        .alert.error {
            background: rgba(166, 62, 62, 0.08);
            color: var(--danger);
        }

        .alert.success {
            background: rgba(53, 122, 66, 0.08);
            color: var(--success);
        }

        .footer {
            text-align: center;
            margin-top: 20px;

            font-size: 0.82rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="card">
            <div class="header">
                <div class="badge">
                    Passwort zurücksetzen
                </div>
                <h1>
                    Neues Passwort festlegen
                </h1>
                <p>
                    Wähle ein neues Passwort für dein Restaurantkonto.
                </p>
            </div>
            <div class="alert error" id="reset-error"></div>
            <div class="alert success" id="reset-success"></div>
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">
                        Neues Passwort
                    </label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="new-password" placeholder="Mindestens 8 Zeichen"
                            autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" id="toggle-new-password">
                            Anzeigen
                        </button>
                    </div>
                    <div class="field-help">
                        Mindestens 8 Zeichen, davon mindestens ein Buchstabe und eine Zahl.
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">
                        Passwort bestätigen
                    </label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="confirm-password"
                            placeholder="Passwort erneut eingeben" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" id="toggle-confirm-password">
                            Anzeigen
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="reset-submit">
                    Neues Passwort speichern
                </button>
            </form>
            <div class="footer">
                <a href="/login.html">
                    ← Zurück zur Anmeldung
                </a>
            </div>
        </div>
    </main>

    <script>

        const newPasswordInput =
            document.getElementById(
                'new-password'
            );

        const confirmPasswordInput =
            document.getElementById(
                'confirm-password'
            );

        const resetForm =
            document.getElementById(
                'reset-password-form'
            );

        const resetError =
            document.getElementById(
                'reset-error'
            );

        const resetSuccess =
            document.getElementById(
                'reset-success'
            );

        const resetSubmit =
            document.getElementById(
                'reset-submit'
            );

        const toggleNewPassword =
            document.getElementById(
                'toggle-new-password'
            );

        const toggleConfirmPassword =
            document.getElementById(
                'toggle-confirm-password'
            );


        function setupPasswordToggle(
            button,
            input
        ) {

            button.addEventListener(
                'click',
                () => {

                    const isHidden =
                        input.type === 'password';

                    input.type =
                        isHidden
                            ? 'text'
                            : 'password';

                    button.textContent =
                        isHidden
                            ? 'Ausblenden'
                            : 'Anzeigen';

                }
            );

        }


        setupPasswordToggle(
            toggleNewPassword,
            newPasswordInput
        );

        setupPasswordToggle(
            toggleConfirmPassword,
            confirmPasswordInput
        );


        /*
          Reset-Token aus der URL lesen
          Beispiel:
          /reset-password.html?token=abc123
        */
        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const resetToken =
            urlParams.get('token');


        if (!resetToken) {

            resetError.textContent =
                'Der Link zum Zurücksetzen des Passworts ist ungültig.';

            resetError.style.display =
                'block';

            resetSubmit.disabled =
                true;

        }


        resetForm.addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();

                resetError.style.display =
                    'none';

                resetSuccess.style.display =
                    'none';


                if (!resetToken) {

                    resetError.textContent =
                        'Der Link zum Zurücksetzen des Passworts ist ungültig.';

                    resetError.style.display =
                        'block';

                    return;

                }


                const newPassword =
                    newPasswordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                const passwordValid =
                    newPassword.length >= 8 &&
                    /[A-Za-z]/.test(newPassword) &&
                    /\d/.test(newPassword);


                if (!passwordValid) {

                    resetError.textContent =
                        'Das Passwort muss mindestens 8 Zeichen lang sein und mindestens einen Buchstaben sowie eine Zahl enthalten.';

                    resetError.style.display =
                        'block';

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    resetError.textContent =
                        'Die Passwörter stimmen nicht überein.';

                    resetError.style.display =
                        'block';

                    return;

                }


                resetSubmit.disabled =
                    true;

                resetSubmit.textContent =
                    'Passwort wird gespeichert...';


                try {

                    const res =
                        await fetch(
                            '/api/auth/reset-password',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body:
                                    JSON.stringify({
                                        token: resetToken,
                                        new_password: newPassword
                                    })
                            }
                        );


                    const data =
                        await res.json();


                    if (
                        !res.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data?.error?.message ||
                            'Das Passwort konnte nicht zurückgesetzt werden.'
                        );

                    }


                    resetSuccess.textContent =
                        data.message ||
                        'Dein Passwort wurde erfolgreich geändert.';

                    resetSuccess.style.display =
                        'block';


                    newPasswordInput.disabled =
                        true;

                    confirmPasswordInput.disabled =
                        true;


                    setTimeout(
                        () => {

                            window.location.href =
                                '/login.html';

                        },
                        1800
                    );


                } catch (err) {

                    resetError.textContent =
                        err.message ||
                        'Beim Zurücksetzen des Passworts ist ein Fehler aufgetreten.';

                    resetError.style.display =
                        'block';

                    resetSubmit.disabled =
                        false;

                    resetSubmit.textContent =
                        'Neues Passwort speichern';

                }

            }
        );

    </script>

</body>

</html>
