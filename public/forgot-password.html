<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passwort vergessen | TableAI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --page-bg: #F3EFEA;
            --card-bg: #FFFFFF;
            --text-main: #292522;
            --text-muted: #746A63;
            --accent: #D4A373;
            --accent-hover: #C9925F;
            --border: #DDD3CA;
            --danger: #A63E3E;
            --success: #357A42;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Plus Jakarta Sans",
                system-ui,
                sans-serif;

            background: var(--page-bg);
            color: var(--text-main);
        }

        .page {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 38px;

            box-shadow:
                0 22px 50px rgba(75, 55, 42, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-flex;

            padding: 7px 15px;

            border-radius: 999px;

            background: #F8EFE7;
            border: 1px solid #E7CDB4;

            color: var(--accent);

            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 18px 0 10px;

            font-size: 1.8rem;
            letter-spacing: -0.04em;
        }

        .header p {
            margin: 0;

            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 700;
        }

        .form-input {
            width: 100%;

            padding: 13px 14px;

            border: 1.5px solid var(--border);
            border-radius: 9px;

            font: inherit;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(212, 163, 115, 0.20);
        }

        .btn-submit {
            width: 100%;

            margin-top: 18px;
            padding: 14px 20px;

            border: none;
            border-radius: 9px;

            background: var(--accent);
            color: var(--text-main);

            font: inherit;
            font-weight: 800;

            cursor: pointer;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .footer {
            text-align: center;
            margin-top: 20px;

            font-size: 0.82rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .alert {
            display: none;

            padding: 12px 14px;
            margin-bottom: 18px;

            border-radius: 8px;

            font-size: 0.84rem;
        }

        .alert.error {
            background: rgba(166, 62, 62, 0.08);
            color: var(--danger);
        }

        .alert.success {
            background: rgba(53, 122, 66, 0.08);
            color: var(--success);
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="card">

            <div class="header">

                <div class="badge">
                    Kontowiederherstellung
                </div>

                <h1>
                    Passwort vergessen?
                </h1>

                <p>
                    Gib die E-Mail-Adresse deines Restaurantkontos ein.
                    Wenn ein Konto mit dieser Adresse existiert,
                    senden wir dir einen Link zum Zurücksetzen deines Passworts.
                </p>

            </div>

            <div class="alert error" id="forgot-error"></div>
            <div class="alert success" id="forgot-success"></div>
            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="forgot-email">
                        E-Mail-Adresse
                    </label>
                    <input type="email" class="form-input" id="forgot-email" placeholder="inhaber@restaurant.de"
                        autocomplete="email" required>
                </div>
                <button type="submit" class="btn-submit">
                    Link zum Zurücksetzen senden
                </button>
            </form>
            <div class="footer">
                <a href="/login.html">
                    ← Zurück zur Anmeldung
                </a>
            </div>
        </div>
    </main>

    <script>

        const forgotForm =
            document.getElementById(
                'forgot-password-form'
            );

        const forgotEmail =
            document.getElementById(
                'forgot-email'
            );

        const forgotError =
            document.getElementById(
                'forgot-error'
            );

        const forgotSuccess =
            document.getElementById(
                'forgot-success'
            );


        forgotForm.addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();

                forgotError.style.display =
                    'none';

                forgotSuccess.style.display =
                    'none';


                const email =
                    forgotEmail.value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    forgotError.textContent =
                        'Bitte gib deine E-Mail-Adresse ein.';

                    forgotError.style.display =
                        'block';

                    return;
                }


                try {

                    const res =
                        await fetch(
                            '/api/auth/forgot-password',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body:
                                    JSON.stringify({
                                        email
                                    })
                            }
                        );


                    const data =
                        await res.json();


                    if (
                        !res.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data?.error?.message ||
                            'Die Anfrage konnte nicht verarbeitet werden.'
                        );
                    }


                    forgotSuccess.textContent =
                        data.message;

                    forgotSuccess.style.display =
                        'block';


                } catch (err) {

                    forgotError.textContent =
                        err.message ||
                        'Beim Zurücksetzen des Passworts ist ein Fehler aufgetreten.';

                    forgotError.style.display =
                        'block';

                }

            }
        );

    </script>

</body>

</html>
